# Production stack for a single server. See docs/DEPLOY.md.
# Start: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Only Caddy is published to the internet (80/443); everything else stays on the internal network.

x-app: &app
  build: .
  image: seo-platform:latest
  env_file: .env.production
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    s3:
      condition: service_started
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs keys to stay until jobs finish: never evict.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage for snapshots and code uploads. To use AWS S3 / Cloudflare R2
  # instead, remove this service and point S3_ENDPOINT etc. at it in .env.production.
  s3:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -volume.max=0 -master.volumeSizeLimitMB=512
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - s3-data:/data

  # One-shot: applies Prisma migrations, then exits. web and worker wait for it.
  migrate:
    build: .
    image: seo-platform:latest
    env_file: .env.production
    command: ["pnpm", "db:migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: ["pnpm", "--filter", "@seo/web", "start"]

  worker:
    <<: *app
    command: ["pnpm", "--filter", "@seo/worker", "start"]
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  redis-data:
  s3-data:
  caddy-data:
  caddy-config:
