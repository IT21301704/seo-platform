# Local development services. Credentials are local-only defaults; override them in .env.
# Start: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-seo_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo} -d ${POSTGRES_DB:-seo_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio_local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minio_local_only}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the snapshot bucket, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_USER} $${MINIO_PASSWORD} &&
      mc mb --ignore-existing local/$${BUCKET}
      "
    environment:
      MINIO_USER: ${S3_ACCESS_KEY_ID:-minio_local}
      MINIO_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minio_local_only}
      BUCKET: ${S3_BUCKET:-snapshots}
    restart: "no"

  # WordPress test site for the companion plugin (Phase 3): apply → verify → rollback.
  wordpress-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp_local_only}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - wordpress-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6-apache
    depends_on:
      wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp_local_only}
    ports:
      - "8080:80"
    volumes:
      - wordpress-data:/var/www/html
      - ./apps/wp-plugin:/var/www/html/wp-content/plugins/seo-platform:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
  wordpress-db-data:
  wordpress-data:
