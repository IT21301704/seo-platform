# Local development services. Credentials are local-only defaults; override them in .env.
# Start: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seo_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-seo_platform}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seo} -d ${POSTGRES_DB:-seo_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for HTML snapshots. MinIO images are no longer published on
  # Docker Hub/quay.io, so we use SeaweedFS (Apache-2.0). The app creates the bucket on startup.
  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333 -volume.max=0 -master.volumeSizeLimitMB=512
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio_local_only}
    ports:
      - "9000:8333" # S3 API
    volumes:
      - s3-data:/data

  # WordPress test site for the companion plugin (Phase 3): apply → verify → rollback.
  wordpress-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp_local_only}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - wordpress-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6-apache
    depends_on:
      wordpress-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wp_local_only}
    ports:
      - "${WORDPRESS_PORT:-8088}:80"
    volumes:
      - wordpress-data:/var/www/html
      - ./apps/wp-plugin:/var/www/html/wp-content/plugins/seo-platform:ro

volumes:
  postgres-data:
  redis-data:
  s3-data:
  wordpress-db-data:
  wordpress-data:
